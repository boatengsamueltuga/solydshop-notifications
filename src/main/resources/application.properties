spring.config.import=optional:application-secrets.properties

spring.application.name=notifications
server.port=8081

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notificationsdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Shared secret the monolith must send as X-Internal-Api-Key on every request
internal.api-key=${INTERNAL_API_KEY}

# RabbitMQ (consumes notification-created events published by the monolith)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
notifications.rabbitmq.exchange=notifications.exchange
notifications.rabbitmq.queue=notifications.create.queue
notifications.rabbitmq.routing-key=notification.created
